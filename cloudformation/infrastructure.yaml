AWSTemplateFormatVersion: '2010-09-09'
Description: 'Serverless Data Pipeline Infrastructure'

Parameters:
  ProjectName:
    Type: String
    Default: serverless-data-pipeline
    Description: Project name for resource tagging

Resources:
  # S3 Bucket for raw and processed data
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-data-lake-${AWS::AccountId}'
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
            Function: !GetAtt S3TriggerLambda.Arn
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # Lambda execution role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${DataLakeBucket.Arn}/*'

  # Lambda function for S3 trigger
  S3TriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-s3-trigger'
      Runtime: python3.9
      Handler: handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      Environment:
        Variables:
          GLUE_JOB_NAME: !Ref GlueETLJob
      Code:
        ZipFile: |
          # Placeholder - deploy actual code via CLI
          def lambda_handler(event, context):
              return {'statusCode': 200}

  # Glue IAM Role
  GlueServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3FullAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:*
                Resource: 
                  - !GetAtt DataLakeBucket.Arn
                  - !Sub '${DataLakeBucket.Arn}/*'

  # Glue ETL Job
  GlueETLJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${ProjectName}-etl-job'
      Role: !GetAtt GlueServiceRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${DataLakeBucket}/scripts/etl_job.py'
        PythonVersion: '3'
      DefaultArguments:
        '--TempDir': !Sub 's3://${DataLakeBucket}/temp/'
        '--job-language': 'python'
      MaxRetries: 1
      GlueVersion: '3.0'
      NumberOfWorkers: 2
      WorkerType: G.1X

Outputs:
  DataLakeBucketName:
    Value: !Ref DataLakeBucket
    Description: S3 bucket for data lake
  
  LambdaFunctionArn:
    Value: !GetAtt S3TriggerLambda.Arn
    Description: ARN of S3 trigger Lambda function
  
  GlueJobName:
    Value: !Ref GlueETLJob
    Description: Name of Glue ETL job
